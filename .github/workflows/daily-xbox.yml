name: Daily Xbox Radar

# Gleicher Zeitplan wie der PlayStation-Radar, aber eigener Workflow: die
# PS-Ausgabe darf nicht von Xbox-Fehlern abhaengen, und der Xbox-Lauf braucht
# allein rund 10 Minuten - mehr als das Zeitlimit des PS-Jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * *'

permissions:
  contents: write

concurrency:
  group: daily-xbox-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Prepare browser runtime
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Verify platform contracts
        run: npm run test:platform
      - name: Collect official Xbox catalog views
        run: npm run xbox:refresh
      - name: Commit Xbox snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/platforms/xbox; then
            echo "Keine Xbox-Aenderungen."
            exit 0
          fi
          git config user.name "playstation-radar-bot"
          git config user.email "playstation-radar-bot@users.noreply.github.com"
          git add data/platforms/xbox/
          git commit -m "Daily Xbox Radar update $(TZ=Europe/Berlin date +%Y-%m-%d)"
          if git push; then
            exit 0
          fi
          git fetch origin main
          if git rebase origin/main && git push; then
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "::error::Xbox-Snapshot konnte nicht gepusht werden. Der Stand wurde nicht ausgeliefert."
          exit 1
