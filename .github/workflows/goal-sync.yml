name: Radar Goal Source Sync
on:
  push:
    branches: [feat/radar-mobile-catalog-goal]
    paths: [tools/goal-payload.json]
permissions:
  contents: write
concurrency:
  group: radar-goal-sync
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Import saved source with exact checksums
        run: python3 tools/goal-import.py
      - name: Save source checkpoint on feature branch
        run: |
          git config user.name 'playstation-radar-bot'
          git config user.email 'playstation-radar-bot@users.noreply.github.com'
          git add app lib scripts data/ps-plus-catalog.json data/game-sources.json package.json README.md docs tools/goal-parts
          if ! git diff --cached --quiet; then
            git commit -m 'feat: import mobile radar and PS Plus catalog foundation'
            git push origin HEAD:feat/radar-mobile-catalog-goal
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run test:goal
      - run: npm run build
