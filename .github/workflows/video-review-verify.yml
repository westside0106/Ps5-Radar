name: Video review verification

on:
  push:
    branches:
      - fix/video-review-20260927

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Goal tests
        run: npm run test:goal
      - name: Refresh editorial against live pipeline source
        run: node scripts/refresh-editorial.mjs
      - name: Validate and sanitize current Radar data
        run: node scripts/sanitize-radar.mjs
      - name: Final health gate
        run: node scripts/finalize-health.mjs
      - name: Production build
        run: npm run build
