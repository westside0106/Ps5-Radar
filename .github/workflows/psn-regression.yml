name: PSN and metadata regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  psn-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test PSN and metadata integrations (mocked APIs; no secrets)
        run: npm run test:psn
      - name: Verify production build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium webkit
      - name: Check Chromium and WebKit mobile browser and private endpoints
        env:
          RADAR_PASSWORD: radar-local
          RADAR_SESSION_SECRET: ci-only-radar-session-secret-32-chars
        run: |
          npm run start -- -p 3100 > /tmp/radar-smoke.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:3100/ >/dev/null && break; sleep 2; done
          node scripts/test-psn-browser-smoke.mjs
      - name: Preserve QA screenshots and performance measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameworld-qa-${{ github.run_id }}
          path: artifacts/gameworld-qa/
          if-no-files-found: ignore
          retention-days: 7
