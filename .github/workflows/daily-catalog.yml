name: Daily PS Plus Catalog

# Eigener Workflow: der Lauf dauert rund 6 Minuten und ist unabhaengig von
# Radar und Xbox. Bewusst zu einer anderen Zeit als die beiden Radars, damit
# nicht drei Workflows gleichzeitig nach main pushen. Die Katalogseite meldet
# einen Stand ab 48 Stunden als veraltet - taeglich genuegt also deutlich.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-plus-igdb.mjs'
      - '.github/workflows/daily-catalog.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * *'

permissions:
  contents: write

concurrency:
  group: daily-ps-plus-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Prepare browser runtime
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
      - name: Verify catalog contracts
        run: npm run test:goal
      - name: Refresh official PS Plus catalog
        run: npm run catalog:refresh
      - name: Enrich verified game metadata (optional IGDB)
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
        run: node scripts/enrich-plus-igdb.mjs
      - name: Commit catalog snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/ps-plus-catalog.json; then
            echo "Keine Katalogaenderungen."
            exit 0
          fi
          git config user.name "playstation-radar-bot"
          git config user.email "playstation-radar-bot@users.noreply.github.com"
          git add data/ps-plus-catalog.json
          git commit -m "PS Plus catalog refresh $(TZ=Europe/Berlin date +%Y-%m-%d)"
          if git push; then
            exit 0
          fi
          git fetch origin main
          if git rebase origin/main && git push; then
            exit 0
          fi
          git rebase --abort 2>/dev/null || true
          echo "::error::Katalog-Snapshot konnte nicht gepusht werden. Der Stand wurde nicht ausgeliefert."
          exit 1
